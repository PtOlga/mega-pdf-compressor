<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MEGA PDF Compressor</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    .btn { background: #00a651; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 10px 0; }
    .btn:disabled { background: #ccc; }
    .status { background: #f5f5f5; padding: 16px; border-radius: 6px; margin: 20px 0; white-space: pre-wrap; }
    .hidden { display: none; }
    .input {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    #loginForm, #folderSelector, #fileSelector, #targetFolderSelector {
      margin: 20px 0;
    }
    h3 {
      color: #00a651;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>📦 MEGA PDF Compressor</h1>
<p>Войдите в MEGA → выберите файл PDF или папку → сожмите → сохраните файлы обратно в MEGA.</p>

<div id="loginForm">
  <input type="email" id="emailInput" placeholder="Email от MEGA" class="input">
  <input type="password" id="passwordInput" placeholder="Пароль от MEGA" class="input">
  <button id="loginBtn" class="btn">🔐 Войти в MEGA</button>
  <p style="font-size: 12px; color: #666; margin-top: 10px;">
    ⚠️ Ваш пароль обрабатывается только в браузере и не отправляется на сервер
  </p>
</div>

<div id="folderSelector" class="hidden">
  <h3>Шаг 1: Выберите папку с PDF файлами</h3>
  <select id="sourceFolderList" class="input"></select>
  <button id="selectSourceFolderBtn" class="btn">📁 Выбрать эту папку</button>
</div>

<div id="fileSelector" class="hidden">
  <h3>Шаг 2: Выберите PDF файл для сжатия</h3>
  <select id="fileList" class="input"></select>
  <button id="selectFileBtn" class="btn">📄 Выбрать этот файл</button>
</div>

<div id="targetFolderSelector" class="hidden">
  <h3>Шаг 3: Куда сохранить сжатый файл?</h3>
  <select id="targetFolderList" class="input"></select>
  <button id="selectTargetFolderBtn" class="btn">💾 Выбрать папку назначения</button>
</div>

<div id="status" class="status hidden"></div>
<button id="compressBtn" class="btn hidden" disabled>📤 Сжать и сохранить в MEGA</button>

<script type="module">
  import { Storage } from 'https://unpkg.com/megajs/dist/main.browser-es.mjs';

  const statusEl = document.getElementById('status');
  const loginBtn = document.getElementById('loginBtn');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const loginForm = document.getElementById('loginForm');

  const folderSelector = document.getElementById('folderSelector');
  const sourceFolderList = document.getElementById('sourceFolderList');
  const selectSourceFolderBtn = document.getElementById('selectSourceFolderBtn');

  const fileSelector = document.getElementById('fileSelector');
  const fileList = document.getElementById('fileList');
  const selectFileBtn = document.getElementById('selectFileBtn');

  const targetFolderSelector = document.getElementById('targetFolderSelector');
  const targetFolderList = document.getElementById('targetFolderList');
  const selectTargetFolderBtn = document.getElementById('selectTargetFolderBtn');

  const compressBtn = document.getElementById('compressBtn');

  let storage = null;
  let selectedFile = null;
  let selectedSourceFolder = null;
  let selectedTargetFolder = null;
  let allFolders = [];
  let allFiles = [];

  // Вход в MEGA
  loginBtn.onclick = async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
      statusEl.textContent = '❌ Введите email и пароль';
      statusEl.classList.remove('hidden');
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = '⏳ Подключение...';
    statusEl.classList.remove('hidden');
    statusEl.textContent = 'Вход в MEGA...';

    try {
      storage = await new Storage({ email, password }).ready;
      statusEl.textContent = '✅ Успешно подключились! Загружаем структуру папок...';

      // Получаем все папки
      allFolders = [];

      // Рекурсивно собираем все папки
      function collectFolders(folder, path = '') {
        if (folder.children) {
          for (const child of folder.children) {
            if (child.directory) {
              const fullPath = path + '/' + child.name;
              allFolders.push({ folder: child, name: child.name, path: fullPath });
              collectFolders(child, fullPath);
            }
          }
        }
      }

      // Добавляем корневую папку (Cloud Drive)
      allFolders.push({ folder: storage.root, name: '📁 Cloud Drive', path: '/Cloud Drive' });
      collectFolders(storage.root, '/Cloud Drive');

      // Добавляем Inbox (Входящие - расшаренные файлы)
      if (storage.inbox && storage.inbox.children && storage.inbox.children.length > 0) {
        allFolders.push({ folder: storage.inbox, name: '📥 Inbox (Входящие)', path: '/Inbox' });
        collectFolders(storage.inbox, '/Inbox');
      }

      // Добавляем все mounts (расшаренные папки)
      if (storage.mounts && storage.mounts.length > 0) {
        storage.mounts.forEach(mount => {
          // Пропускаем root, trash, inbox - они уже добавлены
          if (mount !== storage.root && mount !== storage.trash && mount !== storage.inbox) {
            const mountName = mount.name || 'Shared Folder';
            allFolders.push({ folder: mount, name: `🔗 ${mountName} (Расшарено)`, path: `/Shared/${mountName}` });
            collectFolders(mount, `/Shared/${mountName}`);
          }
        });
      }

      // Заполняем список папок-источников
      sourceFolderList.innerHTML = '';
      targetFolderList.innerHTML = '';

      allFolders.forEach((item, index) => {
        const option1 = document.createElement('option');
        option1.value = index;
        option1.textContent = item.path;
        sourceFolderList.appendChild(option1);

        const option2 = document.createElement('option');
        option2.value = index;
        option2.textContent = item.path;
        targetFolderList.appendChild(option2);
      });

      loginForm.classList.add('hidden');
      folderSelector.classList.remove('hidden');
      statusEl.textContent = `✅ Найдено ${allFolders.length} папок. Выберите папку с PDF файлами.`;

    } catch (error) {
      statusEl.textContent = `❌ Ошибка входа: ${error.message}`;
      loginBtn.disabled = false;
      loginBtn.textContent = '🔐 Войти в MEGA';
    }
  };

  // Шаг 1: Выбор папки-источника
  selectSourceFolderBtn.onclick = () => {
    const index = parseInt(sourceFolderList.value);
    selectedSourceFolder = allFolders[index].folder;

    // Собираем PDF файлы из выбранной папки
    allFiles = [];
    if (selectedSourceFolder.children) {
      for (const child of selectedSourceFolder.children) {
        if (!child.directory && child.name && child.name.toLowerCase().endsWith('.pdf')) {
          allFiles.push(child);
        }
      }
    }

    if (allFiles.length === 0) {
      statusEl.textContent = '❌ В этой папке нет PDF файлов. Выберите другую папку.';
      return;
    }

    // Заполняем список файлов
    fileList.innerHTML = '';
    allFiles.forEach((file, index) => {
      const option = document.createElement('option');
      option.value = index;
      const sizeMB = (file.size / 1024 / 1024).toFixed(2);
      option.textContent = `${file.name} (${sizeMB} МБ)`;
      fileList.appendChild(option);
    });

    folderSelector.classList.add('hidden');
    fileSelector.classList.remove('hidden');
    statusEl.textContent = `✅ Найдено ${allFiles.length} PDF файлов в папке "${allFolders[index].path}"`;
  };

  // Шаг 2: Выбор файла
  selectFileBtn.onclick = () => {
    const index = parseInt(fileList.value);
    selectedFile = allFiles[index];

    const sizeMB = (selectedFile.size / 1024 / 1024).toFixed(2);
    statusEl.innerHTML = `✅ Выбран файл: <b>${selectedFile.name}</b> (${sizeMB} МБ)`;

    fileSelector.classList.add('hidden');
    targetFolderSelector.classList.remove('hidden');
    statusEl.textContent = `✅ Файл выбран. Теперь выберите папку для сохранения сжатого файла.`;
  };

  // Шаг 3: Выбор папки назначения
  selectTargetFolderBtn.onclick = () => {
    const index = parseInt(targetFolderList.value);
    selectedTargetFolder = allFolders[index].folder;

    targetFolderSelector.classList.add('hidden');
    compressBtn.classList.remove('hidden');
    compressBtn.disabled = false;

    const sizeMB = (selectedFile.size / 1024 / 1024).toFixed(2);
    statusEl.innerHTML = `✅ Всё готово!<br>` +
      `Файл: <b>${selectedFile.name}</b> (${sizeMB} МБ)<br>` +
      `Сохранить в: <b>${allFolders[index].path}</b>`;
  };

  // Сжатие и сохранение
  compressBtn.onclick = async () => {
    if (!selectedFile) return;
    compressBtn.disabled = true;
    statusEl.textContent = 'Скачиваем файл из MEGA...';

    try {
      // Загрузка файла из MEGA
      console.log('1. Начинаем загрузку файла:', selectedFile.name);
      console.log('2. Ожидаемый размер:', selectedFile.size, 'bytes');

      statusEl.textContent = 'Загружаем из MEGA...';

      // Используем downloadBuffer() для браузера - это правильный метод megajs
      const arrayBuffer = await selectedFile.downloadBuffer();

      console.log('3. ArrayBuffer получен, размер:', arrayBuffer.byteLength);

      // Проверяем размер
      if (arrayBuffer.byteLength !== selectedFile.size) {
        throw new Error(`Ошибка загрузки: получено ${arrayBuffer.byteLength} байт вместо ${selectedFile.size} байт`);
      }

      if (arrayBuffer.byteLength < 1000) {
        throw new Error(`Файл слишком маленький: ${arrayBuffer.byteLength} байт. Возможно, файл поврежден в MEGA.`);
      }

      // Создаём Blob
      const blob = new Blob([arrayBuffer], { type: 'application/pdf' });
      console.log('6. Blob создан, размер:', blob.size);
      
      const originalSizeMB = (blob.size / 1024 / 1024).toFixed(2);

      statusEl.textContent = `✅ Файл загружен из MEGA: ${originalSizeMB} МБ. Отправляем на сжатие...`;

      // Backend URL на Railway
      const backendUrl = 'https://mega-pdf-compressor-production.up.railway.app/compress';

      const formData = new FormData();
      formData.append('file', blob, selectedFile.name);
      formData.append('level', 'recommended'); // low, recommended, extreme

      console.log('7. Отправляем FormData на backend...');
      statusEl.textContent = `Сжимаем через iLovePDF (${originalSizeMB} МБ)...`;
      const res = await fetch(backendUrl, { method: 'POST', body: formData });

      if (!res.ok) {
        const errorData = await res.json();
        let errorMsg = errorData.error || `HTTP ${res.status}`;
        if (errorData.logs) {
          errorMsg += '\n\n📋 ЛОГИ:\n' + errorData.logs.join('\n');
        }
        throw new Error(errorMsg);
      }

      // Читаем сжатый файл как ArrayBuffer, а не Blob
      const compressedArrayBuffer = await res.arrayBuffer();
      const compressedBytes = new Uint8Array(compressedArrayBuffer);
      const compressedSizeMB = (compressedBytes.length / 1024 / 1024).toFixed(2);

      console.log('8. Compressed bytes length:', compressedBytes.length);

      // Получаем информацию о сжатии из заголовков
      const reduction = res.headers.get('X-Reduction-Percent') || '?';

      statusEl.innerHTML = `✅ Сжато! ${originalSizeMB} МБ → ${compressedSizeMB} МБ (−${reduction}%)`;

      // Загружаем обратно в MEGA в выбранную папку
      statusEl.textContent = 'Загружаем сжатый файл в MEGA...';

      const compressedFileName = '[Сжато] ' + selectedFile.name;
      const uploadedFile = await selectedTargetFolder.upload({
        name: compressedFileName,
        size: compressedBytes.length
      }, compressedBytes).complete;

      statusEl.innerHTML = `🎉 Готово!<br>` +
        `${originalSizeMB} МБ → ${compressedSizeMB} МБ (−${reduction}%)<br>` +
        `Сохранено как: <b>${compressedFileName}</b>`;

      compressBtn.disabled = false;
      compressBtn.textContent = '✅ Сжать ещё один файл';

      // Сбрасываем выбор для нового файла
      compressBtn.onclick = () => {
        location.reload();
      };

    } catch (e) {
      console.error('Ошибка:', e);
      statusEl.textContent = `❌ ${e.message}`;
      compressBtn.disabled = false;
    }
  };
</script>

</body>
</html>
